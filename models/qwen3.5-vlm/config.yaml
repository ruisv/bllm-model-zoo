# Compile knobs for Qwen3.5 image+text (VLM): a vision tower + chunked-prefill
# graph, packaged alongside one of the qwen3.5-{0.8b,2b,4b} text decoders.
#
# Qwen3.5 is natively image-text-to-text — the text-only packages in the sibling
# recipes are a build choice (the vision half is dropped), not a model limitation.
# The vision tower geometry and mrope layout below are IDENTICAL across all three
# decoder sizes (0.8B/2B/4B) — only the decoder's own hidden size changes the
# tower's merger output width. The four vision settings marked "cannot be
# defaulted" below are NOT recoverable from the compiled .hbm — get one wrong and
# the result is shape-correct garbage with no error, only after an image is fed.

vision:
  # ---- cannot be defaulted; wrong values compile fine, fail silently on images ----
  patch: 16                      # Qwen3.5 uses patch16 (Omni's official tower uses patch14 — do not reuse Omni settings)
  mean: [0.5, 0.5, 0.5]          # Qwen3.5 preprocessing constant (Omni uses CLIP mean/std — different)
  mrope_section: [11, 11, 10]    # (t, h, w) rope dimension split (Omni uses [16,24,24] — different)
  mrope_interleaved: true        # frequency layout is [T H W T H W ...], not contiguous segments
  std: [0.5, 0.5, 0.5]
  # ---- geometry, derivable but recorded for completeness ----
  merge: 2                       # 2x2 patch merge before the transformer blocks
  depth: 12                      # ViT blocks — 0.8B/2B tower (4B's tower is deeper, see below)
  hidden: 1152
  heads: 16
  buckets:                       # side-length -> vision tokens per image; pick per deployment
    224: {tokens: 49,  grid: "14x14 -> merge -> 7x7"}
    320: {tokens: 100, grid: "20x20 -> merge -> 10x10"}   # recommended default — see README
    448: {tokens: 196, grid: "28x28 -> merge -> 14x14"}
  note: |
    336px is NOT a legal bucket: patch16 x merge2 requires side % 32 == 0, and
    336/16=21 is odd (no clean 2x2 merge). 320 is the nearest legal mid bucket.
    4B's tower is architecturally different from 0.8B/2B's, not just wider — see
    the qwen3.5-4b-vlm section below (depth 24, hidden 1024->merger out 2560,
    decoupled from the tower's own internal width because the merger projects up
    to the DECODER's hidden size, which differs per sibling).

quantise:
  vision_weights: int8           # per-channel, static
  vision_activations: int16
  vision_calibration:
    method: "max|input| * 1.3 margin, per linear, from a real forward over calibration images"
    dataset: "48 COCO val2017 images"
    note: |
      Massive-activation channels in the tower's deep MLP blocks (not RMSNorm/
      variance, despite that being the a priori suspicion) clip under a flat
      calibration range. A synthetic/rendered reference image UNDER-represents
      the real activation distribution relative to a real photo — a synthetic-
      image gate can read ~0.987 cosine (looks like a near-fail) while the SAME
      build on a held-out real photo reads ~0.997. Calibrate and gate on real
      photos, not synthetic ones.
  vision_keep_fp32: []           # the tower is 100% int8/int16 BPU end to end (see acceptance)

compile:
  march: nash-m                  # nash-m = S100/S100P; nash-p = S600 needs a SEPARATE recompile per bucket+size, see S600 section
  prefill:
    kind: chunked-float          # same recipe as the sibling text-only decoders' prefill graph
    N: 32
    C: 16
    cache_len: matches the paired decoder's cache_len (2048 or 4096)
    s600_trap: |
      At 4B scale specifically, compiling the prefill graph for nash-p at the
      DEFAULT hbcompile optimisation level crashes natively (not a catchable
      exception) with `error: B30 VPU ops do not support circular buffer`.
      2B at the same march compiles fine at the default level; 4B on nash-m
      (S100P) also compiles fine at the default level — it is the combination
      of {nash-p backend, this graph's shape, opt=2} that trips an unsupported
      codegen path. Fix: recompile with a LOWER hbcompile optimisation level
      (opt=0 in the toolchain used here) — same correctness (same
      remaining-CPU-op count as the nash-m build), ~46 min instead of crashing.
      See the qwen3.5-4b recipe's rejected_builds is NOT where this is recorded
      (it is a march+opt combination, not a model-size fact) — it lives here,
      against the prefill-graph compile step.

emit:
  tool: bllm-make-model-dir
  arch: hybrid                   # the paired decoder's arch; vision rides alongside it
  needs: [hbm, embed_tokens.bin, tokenizer.json, visual.hbm, hbm_prefill]
  # common/make_dir.py reads THIS file's `vision:` block and forwards the four
  # un-defaultable settings — see that script for the exact flag mapping.
